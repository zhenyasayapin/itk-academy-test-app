version: '3.8'
services:
  wallet-service:
    build:
      context: ./wallet-service/
      dockerfile: wallet-service.dockerfile
    restart: "always"
    deploy:
      mode: replicated
      replicas: 1
    ports:
      - "8080:8080"
    env_file:
      - config.env
    depends_on:
      - postgres
      
  postgres:
    image: postgres:14.2
    ports:
      - "5433:5432"
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    env_file:
      - config.env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
